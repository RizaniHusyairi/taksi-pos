# =============================================================================
# Supervisor: worker antrian Laravel (memproses email & notifikasi FCM async).
# Diperlukan karena QUEUE_CONNECTION=database. Penting setelah notifikasi
# dijadikan async (rekomendasi #6).
#
# Letakkan di: /etc/supervisor/conf.d/taksi-worker.conf
# Lalu:  sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start taksi-worker:*
# =============================================================================

[program:taksi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/taksi-pos/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/taksi-pos
autostart=true
autorestart=true
stopwaitsecs=3600
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/taksi-pos/storage/logs/worker.log
stopasgroup=true
killasgroup=true
