# =============================================================================
# [#2] Nginx server block untuk taksi-pos (Laravel).
# Letakkan di: /etc/nginx/sites-available/taksi-pos  lalu symlink ke sites-enabled.
# Sesuaikan: server_name, root, versi PHP-FPM socket, path sertifikat.
# =============================================================================

server {
    listen 80;
    server_name kaj.aptpairport.id;
    # Paksa HTTPS (Certbot biasanya menambah blok ini otomatis saat instal SSL).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kaj.aptpairport.id;

    root /var/www/taksi-pos/public;     # WAJIB menunjuk ke /public, bukan root proyek
    index index.php;

    # Sertifikat (diisi/diatur oleh Certbot — `certbot --nginx`).
    ssl_certificate     /etc/letsencrypt/live/kaj.aptpairport.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaj.aptpairport.id/privkey.pem;

    client_max_body_size 20M;           # ruang utk upload bukti transfer / QRIS

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sesuaikan versi PHP yang terpasang (php8.3 / php8.4).
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Jangan layani file tersembunyi (kecuali .well-known utk SSL).
    location ~ /\.(?!well-known).* { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
